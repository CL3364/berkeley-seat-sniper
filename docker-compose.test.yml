# Explicit non-production override for CI/local topology verification.
#
# The base Compose model is production-only. This opt-in override keeps both
# application roles on noop mail so CI cannot contact a provider. The API retains
# the base worker-heartbeat and disk paths, which opt it into aggregate worker /
# outbox / disk readiness, while omitting the production-only backup requirement.

services:
  app:
    environment:
      NODE_ENV: test
      MAIL_TRANSPORT: noop
      BACKUP_SUCCESS_MARKER_FILE: ''

  worker:
    environment:
      NODE_ENV: test
      MAIL_TRANSPORT: noop
